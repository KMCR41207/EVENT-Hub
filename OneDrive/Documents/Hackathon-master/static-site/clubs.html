<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clubs – EventHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo"><div class="logo-icon">C</div><span class="logo-text">Event<span>Hub</span></span></a>
    <nav class="nav-links nav-rainbow">
      <a href="events.html">Discover</a>
      <a href="clubs.html" class="active">Clubs</a>
      <a href="student.html">Student Portal</a>
      <a href="organizer.html">Organizer</a>
    </nav>
    <div class="nav-cta-group">
      <button class="back-btn" onclick="history.back()">← Back</button>
      <a href="events.html" class="btn btn-primary nav-cta">Explore Events</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="events.html">Discover</a><a href="clubs.html">Clubs</a>
    <a href="student.html">Student Portal</a><a href="organizer.html">Organizer</a>
    <div style="padding:.75rem"><a href="events.html" class="btn btn-primary" style="width:100%;justify-content:center">Explore Events</a></div>
  </div>
</header>

<section class="page-hero">
  <div class="aurora-bg" style="opacity:.5"></div>
  <div class="page-hero-content">
    <p class="section-label">Campus Clubs</p>
    <h1 style="font-family:var(--font-display);font-weight:800;font-size:clamp(2.5rem,6vw,4rem);margin-bottom:1rem">Find Your Tribe</h1>
    <p style="color:var(--muted-fg);font-size:1.125rem;max-width:36rem">Explore the clubs that make campus life extraordinary.</p>
  </div>
</section>

<section style="padding:0 1rem 6rem">
  <div class="container">
    <div id="clubs-status" style="text-align:center;padding:4rem 1rem;color:var(--muted-fg);font-size:.95rem">
      Loading clubs...
    </div>
    <div class="grid grid-3 gap-6" id="clubs-grid" style="display:none"></div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-logo"><div class="footer-logo-icon">C</div><span class="font-display font-bold">EventHub</span></div>
    <p class="footer-copy">Made for campus life. Built with passion.</p>
    <div class="footer-links"><a href="events.html">Events</a><a href="clubs.html">Clubs</a><a href="student.html">Students</a></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script>
const catColors = {
  Technology:'#93c5fd', Arts:'#d8b4fe', Sports:'#86efac',
  Culture:'#fdba74', Academic:'#67e8f9', default:'#a5b4fc'
};

async function loadClubs() {
  const status = document.getElementById('clubs-status');
  const grid = document.getElementById('clubs-grid');

  const { data: clubs, error } = await sb.from('clubs').select('*').order('name');

  if (error) {
    status.innerHTML = '⚠️ Failed to load clubs. Please try again later.';
    return;
  }
  if (!clubs || clubs.length === 0) {
    status.textContent = 'No clubs available yet.';
    return;
  }

  status.style.display = 'none';
  grid.style.display = '';

  clubs.forEach(c => {
    const color = catColors[c.category] || catColors.default;
    const border = color.replace(')', ',.2)').replace('rgb', 'rgba');
    grid.innerHTML += `
    <div class="club-card animate-on-scroll" style="border-color:rgba(99,102,241,.15)">
      <div class="flex gap-4 mb-4">
        <div class="club-logo">
          ${c.image_url
            ? `<img src="${c.image_url}" alt="${c.name}" style="width:100%;height:100%;object-fit:cover;border-radius:.5rem">`
            : `<span class="club-logo-letter">${c.name[0]}</span>`}
        </div>
        <div>
          <h3 class="club-name">${c.name}</h3>
          <span class="club-cat" style="color:${color}">${c.category || 'Club'}</span>
        </div>
      </div>
      <p class="club-desc">${c.description || 'A vibrant campus club.'}</p>
      <div class="club-footer">
        <div class="club-members">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          ${c.member_count || 0} members
        </div>
        <div class="club-view" style="color:${color}">
          View
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </div>
    </div>`;
  });
}

loadClubs();
</script>
<script src="click-spark.js"></script>
</body>
</html>
