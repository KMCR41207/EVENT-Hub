<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Events – EventHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo"><div class="logo-icon">C</div><span class="logo-text">Event<span>Hub</span></span></a>
    <nav class="nav-links nav-rainbow">
      <a href="events.html" class="active">Discover</a>
      <a href="clubs.html">Clubs</a>
      <a href="student.html">Student Portal</a>
      <a href="organizer.html">Organizer</a>
    </nav>
    <div class="nav-cta-group">
      <button class="back-btn" onclick="history.back()">← Back</button>
      <a href="events.html" class="btn btn-primary nav-cta">Explore Events</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="events.html">Discover</a><a href="clubs.html">Clubs</a>
    <a href="student.html">Student Portal</a><a href="organizer.html">Organizer</a>
    <div style="padding:.75rem"><a href="events.html" class="btn btn-primary" style="width:100%;justify-content:center">Explore Events</a></div>
  </div>
</header>

<section class="page-hero">
  <div class="aurora-bg" style="opacity:.6"></div>
  <div class="page-hero-content">
    <p class="section-label">Discover</p>
    <h1 style="font-family:var(--font-display);font-weight:800;font-size:clamp(2.5rem,6vw,4rem);margin-bottom:1rem">All Events</h1>
    <p style="color:var(--muted-fg);font-size:1.125rem;max-width:36rem;margin-bottom:2.5rem">Find your next unforgettable campus experience.</p>
    <div class="search-wrap mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" class="search-input" id="search-input" placeholder="Search events...">
    </div>
    <div class="filter-pills" id="filter-pills">
      <button class="pill active" data-cat="All">All</button>
      <button class="pill" data-cat="Hackathon">Hackathon</button>
      <button class="pill" data-cat="Club">Club</button>
      <button class="pill" data-cat="Traditional">Traditional</button>
    </div>
  </div>
</section>

<section style="padding:0 1rem 6rem">
  <div class="container">
    <p id="event-count" style="font-size:.875rem;color:var(--muted-fg);margin-bottom:1.5rem">Loading events...</p>
    <div id="events-status" style="text-align:center;padding:3rem 1rem;color:var(--muted-fg);display:none"></div>
    <div class="grid grid-3 gap-6" id="events-filter-grid"></div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-logo"><div class="footer-logo-icon">C</div><span class="font-display font-bold">EventHub</span></div>
    <p class="footer-copy">Made for campus life. Built with passion.</p>
    <div class="footer-links"><a href="events.html">Events</a><a href="clubs.html">Clubs</a><a href="student.html">Students</a></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script>
const catClass = { Hackathon:'cat-tech', Club:'cat-arts', Traditional:'cat-culture' };
const grid = document.getElementById('events-filter-grid');
const countEl = document.getElementById('event-count');
const statusEl = document.getElementById('events-status');
let allEvents = [];

function renderCard(e) {
  const d = new Date(e.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  const card = document.createElement('a');
  card.href = `event-detail.html?id=${e.id}`;
  card.className = 'event-card';
  card.dataset.title = (e.title||'').toLowerCase();
  card.dataset.desc = (e.description||'').toLowerCase();
  card.dataset.cat = e.category || '';
  card.innerHTML = `
    <div class="event-card-inner">
      <div class="event-card-img">
        <div class="bg" style="background-image:url('${e.image_url || 'https://placehold.co/400x200/1e1b4b/818cf8?text=Event'}')"></div>
        <div class="overlay"></div>
        <span class="cat-badge ${catClass[e.category]||''}">${e.category||'Event'}</span>
        <span style="position:absolute;top:.75rem;right:.75rem;font-size:.65rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:${e.status==='upcoming'?'rgba(74,222,128,.2)':e.status==='ongoing'?'rgba(251,191,36,.2)':'rgba(148,163,184,.2)'};color:${e.status==='upcoming'?'#4ade80':e.status==='ongoing'?'#fbbf24':'#94a3b8'};border:1px solid currentColor;text-transform:capitalize">${e.status||''}</span>
      </div>
      <div class="event-card-body">
        <h3 class="event-card-title">${e.title}</h3>
        <p class="event-card-desc">${e.description||''}</p>
        <div class="event-card-meta">
          <span class="event-card-date">📅 ${d}</span>
        </div>
      </div>
    </div>`;
  return card;
}

function applyFilter() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const activePill = document.querySelector('.pill.active');
  const cat = activePill ? activePill.dataset.cat : 'All';
  let visible = 0;
  grid.querySelectorAll('a').forEach(card => {
    const matchSearch = !search || card.dataset.title.includes(search) || card.dataset.desc.includes(search);
    const matchCat = cat === 'All' || card.dataset.cat === cat;
    card.style.display = matchSearch && matchCat ? '' : 'none';
    if (matchSearch && matchCat) visible++;
  });
  countEl.textContent = visible + ' event' + (visible !== 1 ? 's' : '') + ' found';
}

async function loadEvents() {
  const { data: events, error } = await sb.from('events').select('*').order('date', { ascending: true });

  if (error) {
    countEl.textContent = '';
    statusEl.style.display = 'block';
    statusEl.textContent = '⚠️ Failed to load events. Please try again.';
    return;
  }
  if (!events || events.length === 0) {
    countEl.textContent = '0 events found';
    statusEl.style.display = 'block';
    statusEl.textContent = 'No events available yet.';
    return;
  }

  allEvents = events;
  grid.innerHTML = '';
  events.forEach(e => grid.appendChild(renderCard(e)));
  countEl.textContent = events.length + ' event' + (events.length !== 1 ? 's' : '') + ' found';

  // Search
  document.getElementById('search-input').addEventListener('input', applyFilter);
  // Filter pills
  document.getElementById('filter-pills').addEventListener('click', e => {
    const pill = e.target.closest('.pill');
    if (!pill) return;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    applyFilter();
  });
}

loadEvents();
</script>
<script src="click-spark.js"></script>
</body>
</html>
